name: Release

# Triggered when a version tag (e.g. v0.1.9) is pushed.
# Builds the package, creates a GitHub Release with the packed tarball,
# and (only when NPM_TOKEN is configured) publishes to npm.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, GitHub Release, npm publish
    runs-on: ubuntu-latest

    # Hoist the secret into a job-level env var: the `secrets` context is NOT
    # available in step-level `if:` conditions, but `env` is. This lets the
    # publish step be gated on whether NPM_TOKEN is configured.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag:            $TAG"
          echo "Tag version:    $TAG_VERSION"
          echo "package.json:   $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$TAG' (version '$TAG_VERSION') does not match package.json version '$PKG_VERSION'. Bump the version in package.json or push a matching tag."
            exit 1
          fi
          echo "Tag and package.json version match ($PKG_VERSION)."

      - name: Build package
        run: npm run package

      - name: Pack tarball
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '*.tgz'

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish (no token)
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::warning::NPM_TOKEN is not set - skipped 'npm publish'. The build and GitHub Release still succeeded. Add an NPM_TOKEN repository secret to enable automatic npm publishing."
